<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupcake Gourmet - Vitrine Virtual</title>
    <style>
        :root {
            --cor-primaria: #8B4513; 
            --cor-secundaria: #FFC0CB; 
            --cor-fundo: #FAFAFA;
            --cor-texto: #333333;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
        }

        header {
            background-color: var(--cor-primaria);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .icones-topo a {
            font-size: 1.2rem;
            margin-left: 15px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: opacity 0.3s;
        }

        .icones-topo a:hover {
            opacity: 0.8;
        }

        .vitrine {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .cartao-produto {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .cartao-produto img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background-color: var(--cor-secundaria);
        }

        .info-produto {
            padding: 10px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .nome-produto {
            font-size: 1rem;
            margin: 0 0 5px 0;
            font-weight: 600;
        }

        .preco-produto {
            color: var(--cor-primaria);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-adicionar {
            background-color: var(--cor-primaria);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-adicionar:hover {
            background-color: #6b3410;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cupcake Gourmet</h1>
        <div class="icones-topo">
            <a href="login.html" title="O seu Perfil">👤</a>
            <a href="carrinho.html" title="Carrinho de Compras">🛒</a>
        </div>
    </header>


    {% for item in cupcakes %}
    <div class="cartao-produto">
        <img src="{{ item.imagem_url }}" alt="{{ item.nome }}">
        <div class="info-produto">
            <h2 class="nome-produto">{{ item.nome }}</h2>
            <span class="preco-produto">R$ {{ item.preco }}</span>
            <button class="btn-adicionar" onclick="window.location.href='/carrinho'">Adicionar</button>
        </div>
    </div>
    {% else %}
    <p style="text-align: center; width: 100%;">Não há cupcakes disponíveis no momento.</p>
    {% endfor %}
</main>
</body>
</html>
