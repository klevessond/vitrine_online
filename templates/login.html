<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Cupcake Gourmet</title>
    <style>
        :root {
            --cor-primaria: #8B4513; 
            --cor-secundaria: #FFC0CB; 
            --cor-fundo: #FAFAFA;
            --cor-texto: #333333;
            --cor-borda: #E0E0E0;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area span {
            font-size: 4rem;
        }

        .logo-area h1 {
            color: var(--cor-primaria);
            margin: 10px 0 0 0;
            font-size: 1.8rem;
        }

        .caixa-acesso {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            overflow: hidden;
        }

        .abas {
            display: flex;
            border-bottom: 1px solid var(--cor-borda);
        }

        .aba {
            flex: 1;
            padding: 15px 0;
            text-align: center;
            background-color: #F5F5F5;
            color: #888;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .aba.ativa {
            background-color: white;
            color: var(--cor-primaria);
            border-bottom: 3px solid var(--cor-primaria);
        }

        .conteudo-form {
            padding: 25px;
            display: none; 
        }

        .conteudo-form.ativo {
            display: block;
        }

        .grupo-input {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .grupo-input label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .grupo-input input {
            padding: 12px;
            border: 1px solid var(--cor-borda);
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .grupo-input input:focus {
            border-color: var(--cor-primaria);
        }

        .btn-acao {
            background-color: var(--cor-primaria);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn-acao:hover {
            background-color: #6b3410;
        }

        .link-esqueci {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .link-esqueci:hover {
            text-decoration: underline;
        }
        .mensagens {
            margin: 0 0 15px 0;
            padding: 0;
            list-style: none;
        }

        .mensagens li {
            padding: 10px 12px;
            border-radius: 5px;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .mensagens .erro {
            background-color: #FEECEB;
            color: #D32F2F;
            border: 1px solid #F5C2C0;
        }

        .mensagens .sucesso {
            background-color: #EAF7EC;
            color: #2E7D32;
            border: 1px solid #B9E2BE;
        }

        .voltar-loja {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--cor-primaria);
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="logo-area">
        <span>🧁</span>
        <h1>Cupcake Gourmet</h1>
    </div>

    <div class="caixa-acesso">
        <div class="abas">
            <button type="button" class="aba {% if aba != 'cadastro' %}ativa{% endif %}" id="btn-login" onclick="mudarAba('login')">Já sou cliente</button>
            <button type="button" class="aba {% if aba == 'cadastro' %}ativa{% endif %}" id="btn-cadastro" onclick="mudarAba('cadastro')">Quero me cadastrar</button>
        </div>

        <form id="form-login" class="conteudo-form {% if aba != 'cadastro' %}ativo{% endif %}" action="{{ url_for('login') }}" method="post">
            {% if aba != 'cadastro' %}{% include '_mensagens.html' %}{% endif %}
            <div class="grupo-input">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" name="email" placeholder="O seu e-mail" value="{{ email if aba != 'cadastro' else '' }}" required>
            </div>
            <div class="grupo-input">
                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" name="senha" placeholder="A sua senha" required>
            </div>
            <button type="submit" class="btn-acao">Entrar</button>
        </form>

        <form id="form-cadastro" class="conteudo-form {% if aba == 'cadastro' %}ativo{% endif %}" action="{{ url_for('cadastro') }}" method="post">
            {% if aba == 'cadastro' %}{% include '_mensagens.html' %}{% endif %}
            <div class="grupo-input">
                <label for="cad-nome">Nome Completo</label>
                <input type="text" id="cad-nome" name="nome" placeholder="Como quer ser chamado?" value="{{ nome or '' }}" required>
            </div>
            <div class="grupo-input">
                <label for="cad-email">E-mail</label>
                <input type="email" id="cad-email" name="email" placeholder="O seu melhor e-mail" value="{{ email if aba == 'cadastro' else '' }}" required>
            </div>
            <div class="grupo-input">
                <label for="cad-senha">Criar Senha</label>
                <input type="password" id="cad-senha" name="senha" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>
            <button type="submit" class="btn-acao">Cadastrar</button>
        </form>
    </div>

    <a href="{{ url_for('index') }}" class="voltar-loja">← Voltar à loja</a>

    <script>
        function mudarAba(abaEscolhida) {
            document.getElementById('btn-login').classList.remove('ativa');
            document.getElementById('btn-cadastro').classList.remove('ativa');
            document.getElementById('form-login').classList.remove('ativo');
            document.getElementById('form-cadastro').classList.remove('ativo');

            if (abaEscolhida === 'login') {
                document.getElementById('btn-login').classList.add('ativa');
                document.getElementById('form-login').classList.add('ativo');
            } else {
                document.getElementById('btn-cadastro').classList.add('ativa');
                document.getElementById('form-cadastro').classList.add('ativo');
            }
        }
    </script>
</body>
</html>
