<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupcake Gourmet - Vitrine Virtual</title>
    <style>
        :root {
            --cor-primaria: #8B4513; 
            --cor-secundaria: #FFC0CB; 
            --cor-fundo: #FAFAFA;
            --cor-texto: #333333;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
        }

        header {
            background-color: var(--cor-primaria);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .icones-topo a {
            font-size: 1.2rem;
            margin-left: 15px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: opacity 0.3s;
        }

        .icones-topo a:hover {
            opacity: 0.8;
        }

        /* Grelha que organiza os produtos lado a lado */
        .vitrine {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .cartao-produto {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-align: center;
            transition: transform 0.2s;
        }
        
        .cartao-produto:hover {
            transform: translateY(-5px);
        }

        /* Regras que limitam as imagens */
        .cartao-produto img {
            width: 100%;
            height: 160px; /* Altura fixa para alinhar os cartões */
            object-fit: cover; /* Evita que a imagem fique esticada/esmagada */
        }

        .info-produto {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .nome-produto {
            font-size: 1.1rem;
            margin: 0 0 5px 0;
            font-weight: 600;
        }
        
        .desc-produto {
            font-size: 0.85rem;
            color: #666;
            margin: 0 0 10px 0;
            height: 35px; /* Mantém os botões alinhados */
        }

        .preco-produto {
            color: var(--cor-primaria);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .btn-adicionar {
            background-color: var(--cor-primaria);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-adicionar:hover {
            background-color: #6b3410;
        }
        .icones-topo {
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        header {
            gap: 12px;
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.15rem;
            }

            .icones-topo a {
                margin-left: 10px;
            }
        }

        .saudacao {
            font-size: 0.95rem;
        }

        .icones-topo .link-sair {
            font-size: 0.9rem;
            border: 1px solid white;
            border-radius: 15px;
            padding: 3px 10px;
        }

        .area-mensagens {
            max-width: 1000px;
            margin: 20px auto 0 auto;
            padding: 0 30px;
        }

        .mensagens {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .mensagens li {
            padding: 10px 12px;
            border-radius: 5px;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .mensagens .erro {
            background-color: #FEECEB;
            color: #D32F2F;
            border: 1px solid #F5C2C0;
        }

        .mensagens .sucesso {
            background-color: #EAF7EC;
            color: #2E7D32;
            border: 1px solid #B9E2BE;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cupcake Gourmet</h1>
        <div class="icones-topo">
            {% if cliente_logado %}
            <span class="saudacao">Olá, {{ cliente_logado.nome.split()[0] }}</span>
            <a href="{{ url_for('logout') }}" title="Sair da conta" class="link-sair">Sair</a>
            {% else %}
            <a href="{{ url_for('login') }}" title="Entrar ou cadastrar">👤</a>
            {% endif %}
            <a href="{{ url_for('carrinho') }}" title="Carrinho de Compras">🛒</a>
        </div>
    </header>

    <div class="area-mensagens">
        {% include '_mensagens.html' %}
    </div>

    <main class="vitrine">
        {% for item in cupcakes %}
        <div class="cartao-produto">
            <img src="{{ item.imagem_url }}" alt="{{ item.nome }}">
            <div class="info-produto">
                <h2 class="nome-produto">{{ item.nome }}</h2>
                <p class="desc-produto">{{ item.descricao }}</p>
                <span class="preco-produto">R$ {{ item.preco }}</span>
                <button class="btn-adicionar" onclick="window.location.href='/adicionar/{{ item.id_produto }}'">Adicionar</button>
            </div>
        </div>
        {% else %}
        <p style="text-align: center; grid-column: 1 / -1; width: 100%;">Não há cupcakes disponíveis no momento.</p>
        {% endfor %}
    </main>

</body>
</html>
